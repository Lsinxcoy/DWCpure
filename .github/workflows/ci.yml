name: ci

on:
  push:
    branches: [main, divine-wisdom-core-pure]
  pull_request:
    branches: [main, divine-wisdom-core-pure]
  workflow_dispatch:

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  PYTHONPATH: ${{ github.workspace }}

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create venv and install
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install -U pip
          .venv\Scripts\python.exe -m pip install -e ".[dev,tui]"

      - name: Add venv to PATH
        run: echo "$PWD\.venv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Prepare runtime dirs
        run: |
          if (!(Test-Path var)) { New-Item -ItemType Directory var | Out-Null }
          if (!(Test-Path archive)) { New-Item -ItemType Directory archive | Out-Null }

      - name: Compile
        run: .venv\Scripts\python.exe -m compileall -q src scripts
      - name: Lint (real defects/security only)
        run: .venv\Scripts\ruff.exe check src scripts --select F821,F841,F811,B023,S102
      - name: Pytest (default; live skipped)
        run: .venv\Scripts\python.exe -m pytest -q -p no:cacheprovider
      - name: Gate
        run: .venv\Scripts\python.exe scripts/gate.py --json

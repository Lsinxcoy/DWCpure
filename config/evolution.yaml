# DWC · 进化喂食灰度开关（R370 · B2）
#
# ★ 存在理由: run_term 每轮都产出失败签名（judge.details[].sigs），
#   但在 B2 之前这些签名只回灌 EXPERIENCE 记忆，**从未进过 evolver**
#   ⇒ 进化系统在生产上零输入。本文件控制这条新通路。
#
# ★ 为什么默认关（灰度纪律）:
#   evolver.diagnose 会产提案，提案会走 trial/accept 改变行为。
#   先观测一轮「能喂进去多少、产多少提案」，确认不拖慢主循环、不产垃圾提案，
#   再由用户拍板打开。关着的时候字段仍然写进 TermReport（enabled=False），
#   所以「关」也是可审计的状态，不是静默缺席。
#
# ★ 与 dials.yaml 的分工:
#   dials.yaml  = GAI 五元盘点的**声明**（m/ρ 四布尔）
#   本文件      = 运行时**行为开关**（喂不喂、喂多少）
version: 1

evolution:
  # 是否把 term 的失败签名喂给 evolver.diagnose（必填 · 无默认）
  # ★ 2026-10-19 用户拍板打开（"打开"）—— 先观察落盘量，暂不排 cron 起草
  feed_from_terms: true

  # 单 term 最多喂多少条签名（必填 · 无默认）
  # ★ 上限的理由: 一次 term 可能产出上百条签名（每个失败观测一条），
  #   全喂会拖慢常驻主循环；超出的部分丢弃并在 evo_feed 里如实记 n_dropped。
  max_sigs_per_term: 50

  # ★ R438 · 每日进化轮是否**自动落地**（必填 · 无默认）
  #   改前: dwc_evo_round_cron.py 里 `apply=False` 硬编码 ⇒ 试跑再漂亮也不落盘，
  #         进化系统永远只报告不改变行为。
  #   改后: 由本键控制。关着 ⇒ 只报告（老路）；开着 ⇒ 试跑通过 + 门判过才落。
  #   ★ 仍然不是"无条件落"：run_round 里 apply 只在 `_ok is True` 且
  #     `evolver.accept()` 判 adopted_not_implemented 时才写 rules.json。
  auto_apply: true

  # ★ R438 · 单轮最多落几条（必填 · 无默认）
  #   防止一轮里连续落多条规则互相掩盖效果；超出的只报告不落。
  auto_apply_max_per_round: 1

  # ★ R438 · 提示词进化排程（必填 · 无默认 · -1=关）
  #   值 = Python tm_wday（周一 0 … 周日 6）。当天 04:00 的进化轮结束后，
  #   额外跑一次「已学规则 → 候选提示词 → A/B → 晋升」。
  #   为什么不是每天：A/B 要 stable/candidate 各跑一遍全池子集（1-4 小时），
  #   每天跑会和当日进化轮抢 agent 并发。
  prompt_evolve_weekday: 6

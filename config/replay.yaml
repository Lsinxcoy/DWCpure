# R80 · Dreaming 循环参数（docs/proposal_replay_dreaming_design.html 三裁决③）
# ★ β₁/β₂: 论文 2609.14858 §2.6 未报告具体值（"fixed coefficients" + β≥0 符号约束）
#   ⇒ 初始值 0 = β≥0 边界（纯 discovery quality 退化, **非论文报值**）;
#     非零值须经校准协议（R63-R67 实验纪律）后才许写入。
replay:
  beta1: 0.0          # V = max s_v − β₁·N + β₂·(N/max{1,k}) 的执行成本罚项
  beta2: 0.0          # 并行度奖项
  history_max: 16     # ℋ 快照上限（超限丢最旧 — 内存环形）
  # R252 · §5.2 交替节流-冲刺调度（2609.14858 Figure 6 · ConvDiv 单任务观察）
  # ★ 论文未形式化、未报告系数（单任务行为观察）⇒ 全部必填无默认（β 同款纪律）;
  #   下列为初值非终值, 须经校准协议（R63-R67 纪律）后才许改。
  effort:
    plateau_eps: 0.02   # gain<ε 判平台（论文 §5.2 语义）
    factor_up: 1.15     # 平台期冲刺放大（>1）
    factor_down: 0.9    # 上升期节流收缩（<1）
    lo: 2               # k2 下限
    hi: 8               # k2 上限（初值=现行默认4的×2, 待校准）

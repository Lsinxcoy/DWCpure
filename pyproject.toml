[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dwc"
version = "0.1.0"
description = "DWC · Divine Wisdom Core — an independent resident agent"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "psutil>=6.0", "requests>=2.31", "httpx>=0.27"]

[project.optional-dependencies]
tui = ["textual>=1.0"]      # R239 全屏 TUI（dwc chat 默认; --plain 可退 REPL）

[project.scripts]
dwc = "dwc.cli_main:main"

[tool.setuptools.packages.find]
where = ["src"]
